name: Atualizar dados

on:
  schedule:
    # várias tentativas por dia: o GitHub às vezes atrasa horas; cada rodada só sobrescreve o dia
    - cron: "17 9 * * *"    # 06:17 Brasília
    - cron: "47 10 * * *"   # 07:47
    - cron: "23 12 * * *"   # 09:23
    - cron: "53 14 * * *"   # 11:53
    - cron: "37 17 * * *"   # 14:37
    - cron: "41 21 * * *"   # 18:41
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler highscore
        env:
          FIREBASE_PROJECT: pt-dream
        run: python scripts/update.py
      - name: Salvar
        run: |
          git config user.name "pt-dream-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push

name: Atualizar dados

on:
  schedule:
    # 5 leituras por dia depois do server save (10h de Berlim): 40 min, 1h40, 3h40, 5h40 e 8h40 depois.
    # O cron do GitHub é em UTC; a lista cobre horário de verão e de inverno de Berlim.
    # Cada rodada só completa o que falta; antes do server save ou com tudo pronto, não muda nada.
    - cron: "40 8 * * *"
    - cron: "40 9 * * *"
    - cron: "40 10 * * *"
    - cron: "40 11 * * *"
    - cron: "40 12 * * *"
    - cron: "40 13 * * *"
    - cron: "40 14 * * *"
    - cron: "40 16 * * *"
    - cron: "40 17 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      aceitar_gs:
        description: "Aceitar o GuildStats deste dia jogado (AAAA-MM-DD), se os chars da PT baterem"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler highscore
        env:
          FIREBASE_PROJECT: pt-dream
          ACEITAR_GS: ${{ github.event.inputs.aceitar_gs }}
        run: python scripts/update.py
      - name: Salvar
        run: |
          git config user.name "pt-dream-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push

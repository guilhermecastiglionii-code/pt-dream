name: Atualizar dados

on:
  schedule:
    - cron: "12 10 * * *"   # 07:12 em Brasília
    - cron: "12 16 * * *"   # 13:12 em Brasília (reserva)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler highscore
        env:
          FIREBASE_PROJECT: pt-dream
        run: python scripts/update.py
      - name: Salvar
        run: |
          git config user.name "pt-dream-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push

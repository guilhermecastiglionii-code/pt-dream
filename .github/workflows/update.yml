name: Atualizar dados

on:
  schedule:
    # O GitHub atrasa rodadas agendadas (às vezes horas). Por isso há rodadas ANTES do server save
    # (10h de Berlim = 08:00 UTC no verão europeu, 09:00 UTC no inverno): o script espera o SS
    # e lê o highscore assim que vira. As rodadas da tarde só completam o que faltar.
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"
    - cron: "40 9 * * *"
    - cron: "40 11 * * *"
    - cron: "40 14 * * *"
    - cron: "40 17 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      aceitar_gs:
        description: "Aceitar o GuildStats deste dia jogado (AAAA-MM-DD), se os chars da PT baterem"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler highscore
        env:
          FIREBASE_PROJECT: pt-dream
          ACEITAR_GS: ${{ github.event.inputs.aceitar_gs }}
        run: python scripts/update.py
      - name: Salvar
        run: |
          git config user.name "pt-dream-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git pull --rebase -X theirs origin main || true
          git push
